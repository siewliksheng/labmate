[project]
name = "labmate"
version = "0.1.0"
description = "A multi-agent lab assistant (literature, vision, safety) with a hard-enforced safety escalation gate"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "mcp>=1.0.0",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "langfuse>=2.53",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pillow>=10.4",
    "markdown>=3.7",
    "pyyaml>=6.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
# M6: real orchestrator
orchestration = ["langgraph>=0.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "inspect-ai>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = ["network: requires live internet access (PubMed/Europe PMC/PubChem)"]
